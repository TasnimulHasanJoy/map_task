<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7ff">
  <title>Find a Place | Map Search</title>
  <style>
    :root { color-scheme: light; --ink: #172033; --muted: #667085; --blue: #2457e6; --line: #e4e9f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 42px 20px; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: radial-gradient(ellipse at top left, #eaf0ff 0, transparent 42%), #f7f8fc; }
    main { width: min(100%, 960px); margin: 0 auto; }
    .intro { margin-bottom: 24px; }
    .eyebrow { color: var(--blue); font-size: .76rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0 6px; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.045em; }
    .intro p { margin: 0; color: var(--muted); }
    .card { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: white; box-shadow: 0 18px 55px #1b2b5012; }
    form { display: grid; grid-template-columns: 1fr 1fr auto; align-items: end; gap: 14px; padding: 22px; }
    label { display: block; margin-bottom: 8px; font-size: .85rem; font-weight: 700; }
    input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid #d7deea; border-radius: 10px; outline: none; color: var(--ink); font: inherit; transition: border-color .15s, box-shadow .15s; }
    input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px #2457e61c; }
    button { height: 48px; padding: 0 22px; border: 0; border-radius: 10px; background: var(--blue); color: white; font: inherit; font-weight: 750; cursor: pointer; transition: background .15s, transform .15s; }
    button:hover { background: #1744c6; transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #8ba8ff; outline-offset: 3px; }
    .status { min-height: 22px; padding: 0 22px 13px; color: #b42318; font-size: .88rem; }
    .map-wrap { border-top: 1px solid var(--line); background: #edf1f8; }
    iframe { display: block; width: 100%; height: 470px; border: 0; }
    .caption { display: flex; justify-content: space-between; gap: 12px; padding: 14px 20px; color: var(--muted); font-size: .82rem; }
    @media (max-width: 680px) { body { padding: 28px 14px; } form { grid-template-columns: 1fr; padding: 18px; gap: 12px; } button { width: 100%; } iframe { height: 390px; } .caption { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <div class="eyebrow">Map explorer</div>
      <h1>Find a place</h1>
      <p>Enter a street and city to see the location on the map.</p>
    </header>
    <section class="card" aria-label="Map search">
      <form id="search-form" novalidate>
        <div>
          <label for="street">Street name</label>
          <input id="street" name="street" type="text" placeholder="e.g. Mannerheimintie 1" autocomplete="street-address" required>
        </div>
        <div>
          <label for="city">City name</label>
          <input id="city" name="city" type="text" placeholder="e.g. Helsinki" autocomplete="address-level2" required>
        </div>
        <button type="submit">Search map</button>
      </form>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="map-wrap">
        <iframe id="map" title="Google map showing Helsinki, Finland" src="https://maps.google.com/maps?q=Helsinki%2C%20Finland&t=&z=12&ie=UTF8&iwloc=&output=embed" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
      <div class="caption"><span id="location-label">Showing: Helsinki, Finland</span><span>Map provided by Google Maps</span></div>
    </section>
  </main>
  <script>
    const form = document.getElementById('search-form');
    const streetInput = document.getElementById('street');
    const cityInput = document.getElementById('city');
    const mapFrame = document.getElementById('map');
    const status = document.getElementById('status');
    const locationLabel = document.getElementById('location-label');

    function searchMap(event) {
      event.preventDefault();
      const street = streetInput.value.trim();
      const city = cityInput.value.trim();
      if (!street || !city) {
        status.textContent = 'Please enter both a street name and a city.';
        (!street ? streetInput : cityInput).focus();
        return;
      }
      const query = `${street}, ${city}`;
      mapFrame.src = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
      mapFrame.title = `Google map showing ${query}`;
      locationLabel.textContent = `Showing: ${query}`;
      status.textContent = '';
    }

    form.addEventListener('submit', searchMap);
  </script>
</body>
</html>
